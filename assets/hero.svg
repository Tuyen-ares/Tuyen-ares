<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.sans{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.star{fill:#E0F2FE;animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.cloud{fill:#38BDF8;opacity:.16;animation:drift 46s linear infinite}@keyframes drift{from{transform:translateX(960px)}to{transform:translateX(-140px)}}
.ground{animation:scroll 3.711s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-900px)}}
