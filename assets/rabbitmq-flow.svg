<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Animated RabbitMQ flow: outbox table, producer, exchange, work queue, two competing consumers, and a dead-letter queue.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#14264F"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 9 5 0 9z" fill="#475569"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 9 5 0 9z" fill="#F87171"/></marker>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.box{fill:#0F172A;stroke:#22D3EE;stroke-width:1.5}.dlq{fill:#0F172A;stroke:#F87171;stroke-width:1.5}.t{fill:#E2E8F0;font-size:13px;font-weight:700}.s{fill:#94A3B8;font-size:11px}.line{stroke:#475569;stroke-width:2;fill:none}.slot{fill:#22D3EE;opacity:.25;animation:slot 3s ease-in-out infinite}@keyframes slot{0%,100%{opacity:.15}50%{opacity:.7}}
    .pulse{fill:none;stroke:#22D3EE;stroke-width:2;transform-origin:400px 185px;animation:pulse 1.5s ease-out infinite;animation-delay:.9s}@keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(1.5);opacity:0}}
    .msg{opacity:0;animation:flow 6s linear infinite}@keyframes flow{0%{opacity:0;transform:translate(136px,185px)}4%{opacity:1}94%{opacity:1;transform:translate(770px,92px)}100%{opacity:0;transform:translate(770px,92px)}}
    .msg2{animation-delay:1.5s;animation-name:flow2}@keyframes flow2{0%{opacity:0;transform:translate(136px,185px)}4%{opacity:1}94%{opacity:1;transform:translate(770px,168px)}100%{opacity:0;transform:translate(770px,168px)}}
    .msg3{animation-delay:3s;animation-name:flow}@keyframes flow3{0%{opacity:0;transform:translate(136px,185px)}4%{opacity:1}94%{opacity:1;transform:translate(770px,168px)}100%{opacity:0;transform:translate(770px,168px)}}
    .fail{fill:#F87171;animation:failed 6s linear infinite}@keyframes failed{0%,50%{opacity:0;transform:translate(605px,160px)}55%{opacity:1}85%{opacity:1;transform:translate(605px,274px)}90%,100%{opacity:0;transform:translate(605px,274px)}}
    .ack{fill:#4ADE80;opacity:0;animation:ack 6s infinite}@keyframes ack{0%,90%{opacity:0}93%,99%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="900" height="340" rx="18" fill="url(#bg)"/>
  <text x="32" y="40" fill="#E2E8F0" font-size="16" font-weight="700">RabbitMQ message flow</text>
  <text x="32" y="60" class="s">transactional outbox → broker → competing consumers</text>
  <path class="line" d="M136 185h40m102 0h78m86 0c38 0 50-55 78-55m172 0 78-38m-78 38 78 38" marker-end="url(#arrow)"/>
  <path d="M605 160v88" stroke="#F87171" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowRed)"/>
  <text x="597" y="208" text-anchor="end" font-size="11" fill="#FCA5A5">nack · retries exhausted</text>
  <rect class="box" x="40" y="145" width="96" height="80" rx="12"/><g fill="#22D3EE" opacity=".55"><rect x="54" y="160" width="68" height="8" rx="2"/><rect x="54" y="176" width="68" height="8" rx="2"/><rect x="54" y="192" width="44" height="8" rx="2"/></g>
  <text x="88" y="246" text-anchor="middle" class="t">Outbox</text><text x="88" y="262" text-anchor="middle" class="s">DB table + worker</text>
  <rect class="box" x="178" y="155" width="100" height="60" rx="10"/><text x="228" y="182" text-anchor="middle" class="t">Producer</text><text x="228" y="199" text-anchor="middle" class="s">publish</text>
  <circle class="pulse" cx="400" cy="185" r="42"/><circle class="box" cx="400" cy="185" r="42"/><text x="400" y="182" text-anchor="middle" class="t">Exchange</text><text x="400" y="198" text-anchor="middle" class="s">binding</text><text x="400" y="246" text-anchor="middle" class="s">routing key</text>
  <rect class="box" x="520" y="100" width="170" height="60" rx="10"/><text x="605" y="121" text-anchor="middle" class="t">work.queue</text>
  <rect class="slot" x="533" y="132" width="24" height="18" rx="3"/><rect class="slot" x="563" y="132" width="24" height="18" rx="3" style="animation-delay:.35s"/><rect class="slot" x="593" y="132" width="24" height="18" rx="3" style="animation-delay:.7s"/><rect class="slot" x="623" y="132" width="24" height="18" rx="3" style="animation-delay:1.05s"/><rect class="slot" x="653" y="132" width="24" height="18" rx="3" style="animation-delay:1.4s"/>
  <rect class="box" x="770" y="70" width="100" height="44" rx="10"/><text x="820" y="96" text-anchor="middle" class="t">Consumer 1</text><rect class="box" x="770" y="146" width="100" height="44" rx="10"/><text x="820" y="172" text-anchor="middle" class="t">Consumer 2</text>
  <text class="ack" x="820" y="62" text-anchor="middle" font-size="12">✓ ack</text><text class="ack" x="820" y="206" text-anchor="middle" font-size="12" style="animation-delay:1.5s">✓ ack</text>
  <rect class="dlq" x="520" y="250" width="170" height="50" rx="10"/><text x="605" y="272" text-anchor="middle" class="t">dead-letter queue</text><text x="605" y="289" text-anchor="middle" class="s">inspect · replay</text>
  <g class="msg"><rect x="-9" y="-6.5" width="18" height="13" rx="2.5" fill="#22D3EE"/><path d="m-9-6.5 9 7.5 9-7.5" fill="none" stroke="#0B1020" stroke-width="1.6"/></g>
  <g class="msg msg2"><rect x="-9" y="-6.5" width="18" height="13" rx="2.5" fill="#22D3EE"/><path d="m-9-6.5 9 7.5 9-7.5" fill="none" stroke="#0B1020" stroke-width="1.6"/></g>
  <g class="msg msg3"><rect x="-9" y="-6.5" width="18" height="13" rx="2.5" fill="#22D3EE"/><path d="m-9-6.5 9 7.5 9-7.5" fill="none" stroke="#0B1020" stroke-width="1.6"/></g>
  <g class="fail"><rect x="-9" y="-6.5" width="18" height="13" rx="2.5"/><path d="m-9-6.5 9 7.5 9-7.5" fill="none" stroke="#0B1020" stroke-width="1.6"/></g>
  <g font-size="11"><rect x="32" y="318" width="12" height="9" rx="2" fill="#22D3EE"/><text x="50" y="326" fill="#94A3B8">message</text><text x="118" y="326" fill="#4ADE80">✓ ack</text><rect x="170" y="318" width="12" height="9" rx="2" fill="#F87171"/><text x="188" y="326" fill="#94A3B8">failed → DLQ</text></g>
</svg>
